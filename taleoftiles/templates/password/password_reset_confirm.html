{% extends "empty_base.html" %}
{% load crispy_forms_tags %}
{% load i18n %}

{% block content %}

{% load crispy_forms_tags %}  

<div class="block block-coldbg accounttitle">
  <div class="content">
    <div class="accounttitle-actions">
    <h1>Password Reset Confirm</h1>
  </div>
</div>
</div>

<div class="content grid grid-account">
    
	<div class="formrow">
    <p>{% trans 'enter-new-password' %}.</p>
        <form method="POST">
            {% csrf_token %}
            {{ form|crispy }}                    
            <button class="btn btn-primary" type="submit">Reset password</button>
        </form>        
	</div>


</div>

{% endblock %}
