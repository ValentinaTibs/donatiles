{% extends "base.html" %}

{% load static %}

{% block content %}
  <div class="container">


<h2>ALL BLOG POST</h2>

<h3>MENU</h3>

<ul>
{% for tag in menu_tags %}
  <li>{{ tag.name }}</li>

{% endfor %}
</ul>

<h3>post list</h3>

<ul>
  {% for post in posts %}
    <li>{{ post.title }}</li>

    <a href="{% url 'post' post.slug %}">{{ post.slug }}</a>

    <a>  <img src="{{ post.image.imagefile.url }}" ></a>
{% endfor %}

</ul>

</div>

{% endblock %}
