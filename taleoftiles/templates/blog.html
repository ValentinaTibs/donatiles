{% extends "base.html" %}

{% load static %}

{% block content %}
 

<h2>ALL BLOG POST</h2>

<div class="col-md-3 ml-auto">
  <div class="row ">

  <h3>MENU</h3>

  <aside class="sidebar">
    <ul>
      {% for tag in menu_tags %}
      <a href="{% url 'tag' tag.slug %}"> 
        <li>{{ tag.name }}</li>
      </a>
      {% endfor %}
    </ul>
      
  </aside>
  </div>
</div>


<div class="col-md-9 ">

  <div class="row ">
    {% for post in posts %}
    <div class="col-4 ">


      <a href="{% url 'post' post.slug %}"> {{ post.title }} </a>
      <a href="{% url 'post' post.slug %}"> 
        <img src="{{ post.image.imagefile.url }}"  class="card-img">
      </a>
    

    </div>
   

    {% endfor %}
    
  </div>
</div>


{% endblock %}
