


{% extends "base.html" %}

{% load static %}

{% block content %}
 
<div class="container">


<h2> SHIP THE SAMPLER</h2>


{% if  diff_num_samples == 0 %}  
		
		<p></p>

{% else %}
	<p>You can add more {{ diff_num_samples }} samples </p>
{% endif %}

<form action="/sampler/{{sampler.session_id }}/shipit"   method="post" >
    
	{% csrf_token %}
	{{ form }}
	<input type="hidden" id="session_id" name="session_id" value="{{sampler.session_id}}">
	<input type="submit" value="Save" />

</form>  


<h4>{{message}}</h4>

</div>

{% endblock %}
