{% load i18n %}
{% load view_extra %}
{% load static %}

<div class="product-thumb">
  <a href="{% url 'product' product.code %}" class="product-thumb-img">
  
    <img  src="{% if product.cover %}  {{ product.cover.imagefile.url }} {% endif %}"" alt=" {{ product.name }} / {{ product.serie.name }}">
  </a>
  <a href="{% url 'product' product.code %}" class="product-thumb-title">
    <h5>{{ product.serie.name }}</h5>
    <h4>{{ product.name }}</h4>
  </a>   
</div>
