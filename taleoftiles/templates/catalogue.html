{% extends "empty_base.html" %}
{% load view_extra %}
{% load i18n %}

{% block title%} {% trans 'catalogue-page-name' %} {% endblock%}

{% load static %}

{% block content %}

{% include 'cataloguegrid.html' %}


<script>
var infinite = new Waypoint.Infinite({
    element: $('.infinite-container')[0],
    handler: function(direction) {
},
offset: 'bottom-in-view',

onBeforePageLoad: function () {
$('.spinner-border').show();
},
onAfterPageLoad: function () {
$('.spinner-border').hide();
}

});    

(function () {
    var previous;

    $("#series-select").on('focus', function () {
        previous = this.value;
    }).change(function() {
        // tolgo il precedente
        if(previous != 'all-series'){
          toggleFilter(previous);
        }
        // aggiungo attuale
        if(this.value != 'all-series'){
          toggleFilter(this.value);
        }
    });
})();

function toggleFilter( tagSlug ) {
    $.ajax({
      
        type: "POST",
        url: "{% url 'catalogue' %}",
        data: {
            csrfmiddlewaretoken: $( 'input[name="csrfmiddlewaretoken"]' ).val(),
            url_data : '{{url_data}}', 
            toggleFilter : tagSlug
        },
        success: function(result) {
            //window.history.pushState("object or string", "Title", "{% url 'catalogue' %}?filters={{url_data}}");
            $("#content").html(result);
        },
        error: function(result) {
            console.log('error');
        }
    });
}


function addToSampler( pId ) {

    $.ajax({
        type: "POST",
        url: "{% url 'ajax_add_sample' %}",
        
        data: {
            csrfmiddlewaretoken: $( 'input[name="csrfmiddlewaretoken"]' ).val(),
            product_code : pId
        },
        success: function(result) {
            
            $("#overlaySamples").html(result);
            $("#overlaySamples").addClass('visible');
            $("#button-prod-thumb-"+pId).attr('xlink:href',"{% static 'images/svgdefs.svg#icon-samples-remove' %}");        
            $("#btn-prod-thumb-"+pId).attr("onclick","Javascript:removeFromSampler('"+pId+"')");


        },
        error: function(result) {
            console.log('error');
        }
    });
}


function removeFromSampler( pId ) {
    $.ajax({
        type: "POST",
        
        url: "{% url 'ajax_del_sample' %}",
        data: {
            csrfmiddlewaretoken: $( 'input[name="csrfmiddlewaretoken"]' ).val(),
            product_code : pId
        },
        success: function(result) {

            $("#overlaySamples").html(result);
            $("#overlaySamples").addClass('visible');       
            $("#button-prod-thumb-"+pId).attr('xlink:href',"{% static 'images/svgdefs.svg#icon-samples-add' %}");        
            $("#btn-prod-thumb-"+pId).attr("onclick","Javascript:addToSampler('"+pId+"')");
        },
        error: function(result) {
            console.log('error');
            $("#overlaySamples").addClass('visible');
        }
    });
}

</script>
{% endblock %}
