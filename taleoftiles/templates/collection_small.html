{% load view_extra %}

	<!-- product card -->
	<div class="product-item bg-light">
		<div class="card">
			<div class="thumb-content">

				<a href="single.html">
					{% if collection_info.images.all.0 %}
						<img class="card-img-top img-fluid" 
						src="{{ collection_info.images.all.0.imagefile.url }}" 
						alt="{{ collection_info.publication.title }}">
					{% endif %}
				</a>
				
			</div>
			<div class="card-body">
			    <h4 class="card-title">
			    	<a href="{% url 'collection' collection_info.publication.slug %}"> {{ collection_info.publication.title }}</a>
			    </h4>
			    <ul class="list-inline product-meta">
			    	<li class="list-inline-item">

			    		{% for tag in collection_info.publication.tag.all%}
							<a href="{% url 'collections' tag.slug %}"><i class="fa fa-folder-open-o"></i>{{tag.name}}</a>
						{% endfor %}

			    	</li>
			    	<li class="list-inline-item">
			    		<a href="#"><i class="fa fa-calendar"></i>26th December</a>
			    	</li>
			    </ul>
			    <p class="card-text">
			    	{{ collection_info.publication.content|truncatechars:250}}
			    	<a href="{% url 'collection' collection_info.publication.slug %}"> ... </a>
			    </p>
			    	<a href="{% url 'collection' collection_info.publication.slug %}"> 
			    	<button> view this at home for free</button>
			    	</a>

			    <!-- <div class="product-ratings">
			    	<ul class="list-inline">
			    		<li class="list-inline-item selected"><i class="fa fa-star"></i></li>
			    		<li class="list-inline-item selected"><i class="fa fa-star"></i></li>
			    		<li class="list-inline-item selected"><i class="fa fa-star"></i></li>
			    		<li class="list-inline-item selected"><i class="fa fa-star"></i></li>
			    		<li class="list-inline-item"><i class="fa fa-star"></i></li>
			    	</ul>
			    </div> -->
			</div>
		</div>
	</div>
