{% extends "base.html" %}
{% load static %}

{% block content %}


<h3>Setting</h3>
{% for setting in settings %}
    <li>{{ setting.publication.title }}</li>
{% endfor %}

<h3>Collection</h3>

{% for collection in collections %}
  <a href="{% url 'collection' collection.publication.slug %}"> 
    <li>{{ collection.publication.title }}</li>
  </a>
 {% endfor %}

{% endblock %}
